<template name='ventaForm'>
  <div class="row">
    <div class="col s12">
      <div class="row">
        <h2>LISTA DE VENTAS</h2>						
        <a class="btn" href="{{ pathFor 'ventas'}}">		
          Volver listado de VENTA
        </a>

        <h2>VENTAS</h2>
        <!-- Formulario de Ventas -->
        <form class="form" id="AsignVentas">
          <div class="modal-body">
            <div class="panel panel-warning">
              <div class="panel-body">
                <div class="form-group col-md-12">
                  <label for="clienteDNI">Cliente</label>
                  <input class="form-control" id="clienteDNI" type="text" placeholder="DNI del Cliente" autocomplete="off" />
                  <ul id="sugerencias" class="sugerencias-dropdown" style="display: none;"></ul>
                </div>
                <div class="form-group col-md-12">
                  <label for="detalleCliente">Nombre del Cliente</label>
                  <input class="form-control" id="detalleCliente" type="text" placeholder="Nombre del Cliente" autocomplete="off" spellcheck="off" />
                </div>
                <div class="form-group col-md-12">
                  <label for="fecha">Fecha de Asignación</label>
                  <input type="date" class="form-control form-control-lg" id="fecha" />
                </div>
                <div class="form-group col-md-12">
                  <label for="producto">Productos</label>
                  <input class="form-control" id="producto" type="text" placeholder="Buscar producto" autocomplete="off" />
                  <div id="productoResultados" class="resultados">
                    {{#each productos}}
                      <div class="producto-item" data-producto="{{name}}">{{name}}</div>
                    {{/each}}
                  </div>
                  <input class="form-control" id="cantidad" type="number" placeholder="Cantidad" />
                  <button id="venderProducto" class="btn btn-primary">Vender</button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</template>
