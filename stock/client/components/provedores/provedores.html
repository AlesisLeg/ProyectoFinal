<template name="provedores">
	

	<div class="row">
		<h2>LISTA PROVEDORES</h2>						
		<a class="btn" href="{{ pathFor 'provedor_form'}}">		
			Añadir nuevo Provedor
		</a>
		{{> EasySearch.Input index=provedores atributes=searchAttributes}}
		<form class="form" id="crearProvedor">
		<table>
   		<thead>
   		<tr>
   					<th>DNI</th>
   					<th>Nombre y Apellido</th>
   					<th>Direccion</th>
   		</tr>
   			</thead>
				<tbody>
			      {{#EasySearch.Each index=provedores}}


		<tr>
	      <td>       
             <ul id={{_id}} type="text" name="DNI"> {{name}} </ul>   
		  </td>
            
        	<td>
			 <ul id={{_id}} type="text" name="detalle"> {{detalle}} </ul> 
		  </td> 

		  <td>
			<ul id={{_id}} type="text" name="direccion"> {{direccion}} </ul>
		</td> 
		<td>

			<span class="right">
				<a	href= "#" class="remove">
					<i class="material-icons">Eliminar</i>
				</a>
			</span>

		</td>
        </tr>
          
             {{/EasySearch.Each}}

             </tbody>

      </table>

      {{#EasySearch.IfNoResults index=provedores}}
        <p> No hay Clientes...</p>
      {{/EasySearch.IfNoResults}}

      {{#EasySearch.IfSearching index=provedores}}
        <p>Buscando ...</p>
      {{/EasySearch.IfSearching}}
    
      {{>EasySearch.Pagination index=provedores}}
		</form>
	</div>
</template>
