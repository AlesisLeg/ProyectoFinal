<template name="provedorForm">
	<div class="row">
	<div class="col s12">
<h2>Cargar Nuevo Alumno</h2>
	<!--//////////////////////////////////////////////////////-->
<form class="form" id="crearProvedor">
	<div class="modal-body">
	<div class="panel panel-warning">
	<div class="panel-body">
	
	<div class="form-group">
	  <label for="usr">Nombre</label>
	  <input type="text" class="form-control" id="name" >
	</div>
	
	<div class="form-group">
		<label for="usr">Apellido</label>
		<input type="text" class="form-control" id="surname" >
	</div>
	
	<div class="form-group">
		<label for="usr">DNI</label>
		<input type="text" class="form-control" id="dni" >
	</div>
	
	<div class="form-group">
		<label for="usr">Dirección</label>
		<input type="text" class="form-control" id="address" >
	</div>

	</div>
	</div>
	</div>

	<div class="modal-footer">
		<button type="submit" id="submit" class="btn btn-success">Guardar</button>
		<button type="button" class="btn btn-default" data-dismiss="modal">Cerrar</button>
	</div>
</form>
    </div>
 	</div>
</template>
